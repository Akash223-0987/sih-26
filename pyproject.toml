[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytrace"
version = "0.1.0"
description = "Universal Developer Observability & Structured Telemetry Framework for Python"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aryan-202 / PyTrace Contributors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.9",
    "kafka-python==2.0.2",
    "confluent-kafka>=2.3.0",
    "clickhouse-connect>=0.6.8",
    "neo4j>=5.12.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
