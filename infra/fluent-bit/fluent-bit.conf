[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /logs/*.log
    Tag               pytrace.app
    Parser            json
    Read_from_Head   true
    Refresh_Interval  1

[OUTPUT]
    Name              stdout
    Match             pytrace.*
    Format            json_lines