# =============================================================================
# ULPF Universal Parsers Configuration
# Supports: JSON, Syslog RFC5424, Syslog RFC3164, CEF, LEEF, Apache/Nginx, CSV
# =============================================================================

# ---------------------------------------------------------------------------
# 1. JSON (PyTrace SDK, structured app logs, cloud services)
# ---------------------------------------------------------------------------
[PARSER]
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# ---------------------------------------------------------------------------
# 2. Syslog RFC 5424
#    <PRI>VERSION TIMESTAMP HOSTNAME APP-NAME PROCID MSGID SD MSG
#    Example:
#    <34>1 2026-08-28T12:00:00.000Z fw-01 kernel 101 - - Connection refused
# ---------------------------------------------------------------------------
[PARSER]
    Name        syslog_rfc5424
    Format      regex
    Regex       ^\<(?<pri>[0-9]{1,5})\>(?<version>[0-9]+) (?<timestamp>[^ ]+) (?<hostname>[^ ]+) (?<app_name>[^ ]+) (?<procid>[^ ]+) (?<msgid>[^ ]+) (?<sd>\[.*?\]|-) (?<message>.+)$
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# ---------------------------------------------------------------------------
# 3. Syslog RFC 3164 (BSD Syslog — most network devices, routers, switches)
#    <PRI>MMM DD HH:MM:SS HOSTNAME TAG: MSG
#    Example:
#    <190>Aug 28 12:00:01 router01 sshd[2222]: Accepted publickey for admin
# ---------------------------------------------------------------------------
[PARSER]
    Name        syslog_rfc3164
    Format      regex
    Regex       ^\<(?<pri>[0-9]{1,3})\>(?<timestamp>[A-Z][a-z]{2} [ \d]\d \d{2}:\d{2}:\d{2}) (?<hostname>[^ ]+) (?<app_name>[^\[: ]+)(?:\[(?<procid>\d+)\])?: (?<message>.+)$
    Time_Key    timestamp
    Time_Format %b %d %H:%M:%S
    Time_Keep   On

# ---------------------------------------------------------------------------
# 4. CEF — Common Event Format (ArcSight, Palo Alto, Check Point, Fortinet)
#    CEF:Version|Device Vendor|Device Product|Device Version|Signature ID|Name|Severity|Extensions
#    Example:
#    CEF:0|Palo Alto|PAN-OS|10.0|threat|Malware Detected|8|src=10.0.0.1 dst=8.8.8.8 dpt=443
# ---------------------------------------------------------------------------
[PARSER]
    Name        cef
    Format      regex
    Regex       ^CEF:(?<cef_version>\d+)\|(?<device_vendor>[^|]+)\|(?<device_product>[^|]+)\|(?<device_version>[^|]+)\|(?<signature_id>[^|]+)\|(?<event_name>[^|]+)\|(?<severity>[^|]+)\|(?<extensions>.+)$
    Time_Keep   On

# ---------------------------------------------------------------------------
# 5. LEEF — Log Event Extended Format (IBM QRadar)
#    LEEF:Version|Vendor|Product|Version|EventID|tab-separated key=value pairs
#    Example:
#    LEEF:2.0|IBM|QRadar|1.0|Login|devTime=Aug 28 2026	src=192.168.1.10	usrName=admin
# ---------------------------------------------------------------------------
[PARSER]
    Name        leef
    Format      regex
    Regex       ^LEEF:(?<leef_version>[^\|]+)\|(?<vendor>[^\|]+)\|(?<product>[^\|]+)\|(?<product_version>[^\|]+)\|(?<event_id>[^\|]+)\|(?<attributes>.+)$
    Time_Keep   On

# ---------------------------------------------------------------------------
# 6. Apache / Nginx Combined Access Log
#    IP - USER [DD/Mon/YYYY:HH:MM:SS +ZONE] "METHOD /path HTTP/1.x" STATUS BYTES "REFERER" "UA"
#    Example:
#    192.168.1.5 - admin [28/Aug/2026:12:00:01 +0000] "POST /login HTTP/1.1" 200 512 "-" "curl/7.68"
# ---------------------------------------------------------------------------
[PARSER]
    Name        apache_combined
    Format      regex
    Regex       ^(?<src_ip>[^ ]+) [^ ]+ (?<user_name>[^ ]+) \[(?<timestamp>[^\]]+)\] "(?<http_method>[A-Z]+) (?<http_path>[^ ]+) (?<http_version>[^"]+)" (?<status_code>[0-9]+) (?<bytes_sent>[0-9]+|-)( "(?<referer>[^"]*)" "(?<user_agent>[^"]*)")?$
    Time_Key    timestamp
    Time_Format %d/%b/%Y:%H:%M:%S %z
    Time_Keep   On

# ---------------------------------------------------------------------------
# 7. Windows Event Log (NXLog CSV export)
#    Example:
#    2026-08-28T12:00:00,Security,4624,admin,WORKSTATION01,192.168.1.10,Logon
# ---------------------------------------------------------------------------
[PARSER]
    Name        windows_event_csv
    Format      regex
    Regex       ^(?<timestamp>[^,]+),(?<log_source>[^,]+),(?<event_id>[^,]+),(?<user_name>[^,]+),(?<hostname>[^,]+),(?<src_ip>[^,]+),(?<action>.+)$
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S
    Time_Keep   On
