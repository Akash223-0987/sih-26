# =============================================================================
# ULPF Universal Fluent Bit Collection Pipeline
# Sources: JSON app logs, Syslog RFC5424, RFC3164, CEF, LEEF, Apache, Windows CSV
# =============================================================================

[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

# ---------------------------------------------------------------------------
# INPUTS — One tail block per log format, each with its own parser and tag.
# Tags drive downstream routing. All files land in /logs/ (shared Docker volume).
# ---------------------------------------------------------------------------

# 1. PyTrace / Structured JSON app logs
[INPUT]
    Name              tail
    Path              /logs/application.log
    Tag               ulpf.json
    Parser            json
    Read_from_Head    true
    Refresh_Interval  1
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# 2. Syslog RFC 5424 (modern Linux, cloud infra, firewalls with RFC5424 support)
[INPUT]
    Name              tail
    Path              /logs/syslog_rfc5424.log
    Tag               ulpf.syslog5424
    Parser            syslog_rfc5424
    Read_from_Head    true
    Refresh_Interval  1
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# 3. Syslog RFC 3164 (routers, switches, legacy network devices, BSD syslog)
[INPUT]
    Name              tail
    Path              /logs/syslog_rfc3164.log
    Tag               ulpf.syslog3164
    Parser            syslog_rfc3164
    Read_from_Head    true
    Refresh_Interval  1
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# 4. CEF — Palo Alto, Fortinet, Check Point, ArcSight, Cisco ASA
[INPUT]
    Name              tail
    Path              /logs/cef.log
    Tag               ulpf.cef
    Parser            cef
    Read_from_Head    true
    Refresh_Interval  1
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# 5. LEEF — IBM QRadar
[INPUT]
    Name              tail
    Path              /logs/leef.log
    Tag               ulpf.leef
    Parser            leef
    Read_from_Head    true
    Refresh_Interval  1
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# 6. Apache / Nginx Combined Access Log
[INPUT]
    Name              tail
    Path              /logs/apache_access.log
    Tag               ulpf.apache
    Parser            apache_combined
    Read_from_Head    true
    Refresh_Interval  1
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# 7. Windows Event Log (NXLog/winlogbeat CSV export)
[INPUT]
    Name              tail
    Path              /logs/windows_events.log
    Tag               ulpf.windows
    Parser            windows_event_csv
    Read_from_Head    true
    Refresh_Interval  1
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# ---------------------------------------------------------------------------
# FILTER — Stamp each event with its log_format so the consumer knows
#          which normalizer to invoke without re-parsing the tag.
# ---------------------------------------------------------------------------

[FILTER]
    Name    record_modifier
    Match   ulpf.json
    Record  log_format json

[FILTER]
    Name    record_modifier
    Match   ulpf.syslog5424
    Record  log_format syslog_rfc5424

[FILTER]
    Name    record_modifier
    Match   ulpf.syslog3164
    Record  log_format syslog_rfc3164

[FILTER]
    Name    record_modifier
    Match   ulpf.cef
    Record  log_format cef

[FILTER]
    Name    record_modifier
    Match   ulpf.leef
    Record  log_format leef

[FILTER]
    Name    record_modifier
    Match   ulpf.apache
    Record  log_format apache_combined

[FILTER]
    Name    record_modifier
    Match   ulpf.windows
    Record  log_format windows_event_csv

# ---------------------------------------------------------------------------
# OUTPUTS — All normalized streams fan into a single Kafka topic.
#           Consumers read log_format field to pick the right normalizer.
# ---------------------------------------------------------------------------

[OUTPUT]
    Name              kafka
    Match             ulpf.*
    Brokers           kafka:9092
    Format            json
    Topics            enterprise-logs

[OUTPUT]
    Name              stdout
    Match             ulpf.*
    Format            json_lines
